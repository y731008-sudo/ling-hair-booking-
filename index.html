<title>伶髮藝線上預約</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
/* Layout: one phone-width column; dark espresso header like the LINE DM, cream menu cards, sticky bottom bar carrying the selection */
:root{
  --espresso:#2b1d16; --espresso-2:#3d2a1f; --gold:#b8894f; --gold-soft:#d9b98a;
  --bg:#efe7dc; --card:#f8f3ec; --line:#ddd0bf; --ink:#2b1d16; --ink-2:#6d5a4b;
  --on-dark:#f3e6d3; --ok:#4f7a4a; --danger:#a5452f;
  --f-display:"Noto Serif TC","Songti TC","PMingLiU",serif;
  --f-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --espresso:#1a120d; --espresso-2:#2a1d15; --gold:#d0a56b; --gold-soft:#e2c597;
  --bg:#15100c; --card:#221913; --line:#3a2c22; --ink:#f0e4d4; --ink-2:#b5a08b;
  --on-dark:#f3e6d3; --ok:#86b07e; --danger:#e08a73; color-scheme:dark}}
:root[data-theme="dark"]{
  --espresso:#1a120d; --espresso-2:#2a1d15; --gold:#d0a56b; --gold-soft:#e2c597;
  --bg:#15100c; --card:#221913; --line:#3a2c22; --ink:#f0e4d4; --ink-2:#b5a08b;
  --on-dark:#f3e6d3; --ok:#86b07e; --danger:#e08a73; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6}
.wrap{max-width:560px;margin:0 auto;padding-inline:16px;padding-block:0 120px}
header.top{background:var(--espresso);color:var(--on-dark);padding:22px 16px 0;text-align:center}
.logo{display:block;width:120px;height:120px;margin:0 auto 8px;border-radius:50%;box-shadow:0 0 0 3px var(--gold)}
.brand{font-family:var(--f-display);font-size:26px;letter-spacing:.18em;color:var(--gold-soft);margin:0}
.tag{font-size:12px;letter-spacing:.3em;color:var(--on-dark);opacity:.75;margin:2px 0 14px}
nav.tabs{display:flex;max-width:560px;margin:0 auto}
nav.tabs button{flex:1;background:none;border:0;color:var(--on-dark);opacity:.6;font:inherit;font-size:14px;padding:12px 2px;border-bottom:3px solid transparent;cursor:pointer}
nav.tabs button[aria-selected="true"]{opacity:1;border-bottom-color:var(--gold);color:var(--gold-soft)}
button:focus-visible,input:focus-visible,textarea:focus-visible,.chip:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
h2.sec{font-family:var(--f-display);font-size:21px;letter-spacing:.12em;margin:28px 0 4px;display:flex;align-items:center;gap:10px}
h2.sec::after{content:"";flex:1;height:1px;background:var(--line)}
.sec-note{color:var(--ink-2);font-size:13px;margin:0 0 12px}
.list{display:grid;gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.card.sel{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold)}
.row{display:flex;align-items:baseline;gap:10px;justify-content:space-between}
.name{font-family:var(--f-display);font-size:18px;font-weight:700;min-width:0}
.price{font-family:var(--f-display);font-size:19px;color:var(--gold);white-space:nowrap;font-variant-numeric:tabular-nums}
.price small{font-size:12px;margin-left:2px}
.inc{margin:8px 0 0;padding:0;list-style:none;display:flex;flex-wrap:wrap;gap:6px}
.inc li{font-size:12px;color:var(--ink-2);border:1px solid var(--line);border-radius:999px;padding:1px 9px}
.inc li b{font-weight:500;color:var(--gold)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.chip{font:inherit;font-size:14px;border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:999px;padding:5px 12px;cursor:pointer;font-variant-numeric:tabular-nums}
.chip[aria-pressed="true"]{background:var(--espresso);color:var(--gold-soft);border-color:var(--espresso)}
.chip:disabled{opacity:.35;cursor:not-allowed;text-decoration:line-through}
.pick{margin-top:10px;font:inherit;font-size:14px;border:1px solid var(--gold);color:var(--gold);background:transparent;border-radius:999px;padding:5px 14px;cursor:pointer}
.card.sel .pick{background:var(--gold);color:var(--espresso)}
.simple{display:flex;align-items:center;gap:12px;padding:12px 14px;cursor:pointer}
.simple .name{font-size:16px;flex:1}
.box{width:22px;height:22px;border-radius:6px;border:1.5px solid var(--gold);flex:none;display:grid;place-items:center;color:var(--espresso);font-size:14px}
.card.sel .box{background:var(--gold)}
.fine{font-size:12px;color:var(--ink-2);margin:8px 0 0}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--espresso);color:var(--on-dark);padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));z-index:5}
.bar-in{max-width:560px;margin:0 auto;display:flex;align-items:center;gap:12px}
.bar-info{flex:1;min-width:0;font-size:13px}
.bar-info strong{display:block;font-family:var(--f-display);font-size:20px;color:var(--gold-soft);font-variant-numeric:tabular-nums}
.btn{font:inherit;font-weight:700;border:0;border-radius:999px;padding:11px 22px;background:var(--gold);color:#2b1d16;cursor:pointer}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.danger{background:var(--danger);color:#fff}
.dates{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 10px;scroll-snap-type:x mandatory}
.date{flex:none;width:64px;scroll-snap-align:start;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:8px 0;text-align:center;font:inherit;cursor:pointer}
.date .d{display:block;font-family:var(--f-display);font-size:22px;line-height:1.2}
.date .w{font-size:12px;color:var(--ink-2)}
.date[aria-pressed="true"]{background:var(--espresso);border-color:var(--espresso);color:var(--gold-soft)}
.date[aria-pressed="true"] .w{color:var(--on-dark)}
.date:disabled{opacity:.35;cursor:not-allowed}
.times{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.times .chip{border-radius:10px;padding:8px 0;text-align:center}
label.f{display:block;font-size:13px;color:var(--ink-2);margin:14px 0 4px}
input.t,textarea.t{width:100%;font:inherit;font-size:16px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink)}
textarea.t{min-height:70px;resize:vertical}
.err{color:var(--danger);font-size:13px;margin:6px 0 0}
.sum{margin:0;padding:0;list-style:none}
.sum li{display:flex;justify-content:space-between;gap:12px;padding:6px 0;border-bottom:1px dashed var(--line);font-variant-numeric:tabular-nums}
.sum li:last-child{border-bottom:0}
.total{display:flex;justify-content:space-between;font-family:var(--f-display);font-size:18px;margin-top:8px}
.total span:last-child{color:var(--gold)}
.ticket{text-align:center;padding:26px 18px}
.code{font-family:var(--f-display);font-size:34px;letter-spacing:.2em;color:var(--gold);margin:6px 0}
.status{font-size:12px;border-radius:999px;padding:1px 10px;white-space:nowrap}
.status.on{background:color-mix(in srgb,var(--ok) 18%,transparent);color:var(--ok)}
.status.off{background:color-mix(in srgb,var(--ink-2) 18%,transparent);color:var(--ink-2)}
.status.past{background:color-mix(in srgb,var(--gold) 18%,transparent);color:var(--gold)}
.meta{color:var(--ink-2);font-size:13px;margin:4px 0 0}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
.confirm{margin-top:12px;padding:10px 12px;border-radius:10px;background:color-mix(in srgb,var(--danger) 10%,transparent);font-size:14px}
.stamps{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin:14px 0 6px}
.stamp{aspect-ratio:1;max-width:100%;border-radius:50%;border:1.5px dashed var(--gold);display:grid;place-items:center;font-family:var(--f-display);color:var(--ink-2);font-size:15px}
.stamp.on{background:var(--gold);border-style:solid;color:#2b1d16;font-size:20px}
.stamp.gift{border-style:solid}
.mcard{background:var(--espresso);color:var(--on-dark);border-radius:16px;padding:18px 16px}
.mcard .name{color:var(--gold-soft)}
.mcard .stamp{color:var(--on-dark)}
.mcard .meta{color:var(--on-dark);opacity:.75}
select.t{width:100%;font:inherit;font-size:16px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink)}
.qr{display:block;width:200px;max-width:100%;margin:10px auto 0;border-radius:10px;background:#fff;padding:8px}
.payrow{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 0;border-bottom:1px dashed var(--line)}
.payrow:last-child{border-bottom:0}
.payrow .lbl{flex:1;min-width:0;font-size:15px}
.payrow img{width:44px;height:44px;border-radius:6px;background:#fff;object-fit:contain}
.upl{font-size:13px;color:var(--gold);cursor:pointer;border:1px solid var(--gold);border-radius:999px;padding:3px 10px}
.upl input{display:none}
.subtabs{display:flex;flex-wrap:wrap;gap:8px;padding:16px 0 4px}
.subtabs .chip{flex:none}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:10px}
.cw{text-align:center;font-size:12px;color:var(--ink-2)}
.cday{font:inherit;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;min-height:52px;padding:4px 2px;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;min-width:0}
.cday .n{font-variant-numeric:tabular-nums}
.cday.today{border-color:var(--gold)}
.cday.sel{background:var(--espresso);color:var(--gold-soft);border-color:var(--espresso)}
.cday.closed{opacity:.5}
.tag-s{font-size:11px;color:var(--ink-2)}
.dots{display:flex;gap:2px}
.dc,.dp{font-style:normal;font-size:11px;line-height:16px;min-width:16px;padding:0 3px;border-radius:8px;text-align:center}
.dc{background:var(--ok);color:#fff}
.dp{background:var(--gold);color:#2b1d16}
.legend{font-size:12px;color:var(--ink-2);margin:8px 0 0}
.notice{margin:14px 0 0;padding:10px 12px;border-radius:10px;background:color-mix(in srgb,var(--gold) 18%,transparent);font-size:14px}
.card.dim{opacity:.55}
.chk{display:flex;gap:8px;align-items:center;margin-top:14px;font-size:14px}
.empty{text-align:center;color:var(--ink-2);padding:28px 10px}
.hours{font-size:13px;color:var(--ink-2);margin:14px 0 0;text-align:center}
/* 儲值會員卡 */
.bal{font-family:var(--f-display);font-size:38px;color:var(--gold-soft);line-height:1.2;font-variant-numeric:tabular-nums}
.gl{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.gl span{font-size:13px;border:1px solid color-mix(in srgb,var(--gold) 60%,transparent);color:var(--gold-soft);border-radius:999px;padding:2px 10px}
.qrbox{width:190px;margin:12px auto 6px;background:#fff;padding:6px;border-radius:10px}
.qrbox img{display:block;width:100%;aspect-ratio:1;image-rendering:pixelated}
.log{list-style:none;margin:0;padding:0}
.log li{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px dashed var(--line);font-size:14px}
.log li:last-child{border-bottom:0}
.log small{display:block;color:var(--ink-2);font-size:12px}
.log .r{text-align:right;max-width:48%;font-variant-numeric:tabular-nums}
.plus{color:var(--ok)}.minus{color:var(--danger)}
.grow{display:flex;gap:6px;margin-top:6px;align-items:center}
.grow .t{padding:8px 10px;font-size:15px}
.wrow{font:inherit;color:inherit;text-align:left;display:flex;justify-content:space-between;align-items:center;gap:10px;cursor:pointer;width:100%}
#scan{position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:20;display:grid;place-items:center;padding:16px}
.scan-in{width:100%;max-width:420px;text-align:center;color:#fff}
.scan-in video{width:100%;border-radius:14px;background:#000;outline:3px solid var(--gold);outline-offset:-3px}
/* 店家專用網址（#admin）：只顯示後台 */
body.admin-mode nav.tabs,body.admin-mode [data-go="menu"],body.admin-mode #bar{display:none!important}
@media (prefers-reduced-motion:no-preference){.card,.chip,.date{transition:background .15s,border-color .15s}}
</style>

/* ===== 儲存（此版本存在本機瀏覽器） ===== */
const KEY="salon-bookings-v1"; let memStore=[];
function load(){if(CLOUD)return CACHE.slice();try{const s=localStorage.getItem(KEY);return s?JSON.parse(s):memStore}catch(e){return memStore}}
function save(list){memStore=list;try{localStorage.setItem(KEY,JSON.stringify(list))}catch(e){}}
/* 雲端：bookings 存完整資料（只有店家能列出）；avail 只放日期、時間、狀態、代碼，給客人判斷空檔；lookup 用手機雜湊找回自己的預約 */
function notify(type,b){if(!CLOUD||!NOTIFY_URL||!b.id)return;
  const d=type==="new"?{type,id:b.id,name:b.name,phone:b.phone,items:(b.items||[]).map(i=>i.name),total:b.total,up:b.up,note:b.note}:{type,id:b.id,name:b.name};
  try{fetch(NOTIFY_URL,{method:"POST",mode:"no-cors",keepalive:true,body:JSON.stringify(d)}).catch(()=>{})}catch(e){}}
async function addBooking(b){
  if(!CLOUD){const l=load();l.push(b);save(l);return b}
  const ref=fdb.collection("bookings").doc();b.id=ref.id;const batch=fdb.batch();
  batch.set(ref,b);
  batch.set(fdb.collection("avail").doc(ref.id),{date:b.date,time:b.time,status:b.status,code:b.code});
  batch.set(fdb.collection("lookup").doc(await sha(b.phone)),{ids:firebase.firestore.FieldValue.arrayUnion(ref.id)},{merge:true});
  await batch.commit();return b}
async function changeStatus(b,st){const t=new Date().toISOString();
  if(!CLOUD){const l=load(),x=l.find(y=>y.code===b.code&&y.date===b.date&&y.time===b.time&&isActive(y));if(x){x.status=st;x[st+"At"]=t;save(l)}return}
  const batch=fdb.batch();
  batch.update(fdb.collection("bookings").doc(b.id),{status:st,[st+"At"]:t});
  batch.update(fdb.collection("avail").doc(b.id),{status:st});
  await batch.commit()}
function refresh(){if(view==="menu")renderMenu();if(view==="book"&&!lastBooking)keepForm(renderBook);
  if(view==="admin"&&(adminTab==="cal"||(CLOUD&&!isAdmin)))renderAdmin()}
function startCloud(){if(!CLOUD)return;let unsub=null;
  fdb.collection("config").doc("shop").onSnapshot(d=>{if(d.exists)applySettings(d.data());refresh()},e=>console.warn(e));
  fauth.onAuthStateChanged(async u=>{if(unsub)unsub();isAdmin=false;
    if(u){try{await fdb.collection("bookings").limit(1).get();isAdmin=true}catch(e){isAdmin=false;adminLoginErr="這個帳號沒有店家權限。";fauth.signOut()}}
    const since=ymd(new Date(Date.now()-90*864e5));
    unsub=fdb.collection(isAdmin?"bookings":"avail").where("date",">=",since).onSnapshot(q=>{CACHE=q.docs.map(d=>({id:d.id,...d.data()}));refresh()},e=>console.warn(e));
    refresh()})}

/* ===== 時段 ===== */
const pad=n=>String(n).padStart(2,"0");
const ymd=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const WK="日一二三四五六";
function slotsOf(){const [oh,om]=SHOP.open.split(":").map(Number),[ch,cm]=SHOP.close.split(":").map(Number);
  const out=[];for(let m=oh*60+om;m<=ch*60+cm;m+=SHOP.step)out.push(`${pad(m/60|0)}:${pad(m%60)}`);return out}
const isActive=b=>b.status==="pending"||b.status==="confirmed"||b.status==="booked";
function taken(date,time){return load().filter(b=>isActive(b)&&b.date===date&&b.time===time).length}
/* 每個時段最多 SHOP.capacity 位客人，待確認的預約也算；店家確認過的時段一定鎖住 */
/* 店家在行事曆關閉的時段（現場客、其他服務）也不能預約 */
function slotBlocked(date,time){if(((SHOP.blocked||{})[date]||[]).includes(time))return true;const l=load().filter(b=>isActive(b)&&b.date===date&&b.time===time);return l.some(b=>b.status==="confirmed")||l.length>=SHOP.capacity}
function genCode(){const used=new Set(load().filter(x=>isActive(x)&&!isPast(x.date,x.time)).map(x=>x.code));
  const free=[];for(let i=0;i<100;i++){const c=pad(i);if(!used.has(c))free.push(c)}
  let code=free.length?free[Math.random()*free.length|0]:null;
  for(let n=100;!code;n++)if(!used.has(String(n)))code=String(n); /* 兩位數用完時改用三位數 */
  return code}
function isPast(date,time){return new Date(`${date}T${time}:00`)<=new Date()}
function dayHasSlot(date){return slotsOf().some(t=>!isPast(date,t)&&!slotBlocked(date,t))}

function renderBook(){
  const items=chosenItems();
  if(lastBooking){renderTicket();return}
  if(!items.length){$("#v-book").innerHTML=`<div class="empty"><p>請先到「價目表」選擇想預約的項目。</p><button class="btn" data-go="menu">前往價目表</button></div>`;return}
  const days=[];const now=new Date();
  for(let i=0;i<SHOP.days;i++){const d=new Date(now.getFullYear(),now.getMonth(),now.getDate()+i);days.push(d)}
  if(pickDate){const pd=new Date(pickDate+"T00:00:00");if(isClosed(pd,pickDate)){pickDate=null;pickTime=null}}
  if(!pickDate){const first=days.find(d=>!isClosed(d,ymd(d))&&dayHasSlot(ymd(d)));pickDate=first?ymd(first):null}
  const {sum,up}=totals(items);
  $("#v-book").innerHTML=`
  <h2 class="sec">選擇日期</h2>
  <div class="dates">${days.map(d=>{const k=ymd(d),closed=isClosed(d,k),full=!closed&&!dayHasSlot(k);
    return `<button class="date" data-date="${k}" aria-pressed="${pickDate===k}" ${closed||full?"disabled":""}>
      <span class="w">${d.getMonth()+1}月</span><span class="d">${d.getDate()}</span><span class="w">${closed?"公休":full?"額滿":"週"+WK[d.getDay()]}</span></button>`}).join("")}</div>
  <h2 class="sec">選擇時間</h2>
  ${pickDate?`<div class="times">${slotsOf().map(t=>{const dis=isPast(pickDate,t)||slotBlocked(pickDate,t);
    return `<button class="chip" data-time="${t}" aria-pressed="${pickTime===t}" ${dis?"disabled":""}>${t}</button>`}).join("")}</div>`:`<p class="sec-note">近期已無可預約時段。</p>`}
  <h2 class="sec">聯絡資料</h2>
  <form id="bk" novalidate>
    <label class="f" for="f-name">姓名</label><input class="t" id="f-name" autocomplete="name" placeholder="王小美" required>
    <label class="f" for="f-phone">手機號碼（查詢、取消預約時使用）</label><input class="t" id="f-phone" type="tel" inputmode="numeric" autocomplete="tel" placeholder="0912345678" required>
    <label class="f" for="f-note">備註（選填）</label><textarea class="t" id="f-note" placeholder="例：髮量較多、想染霧感奶茶色"></textarea>
    ${F.pay?`<label class="f">付款方式（到店結帳時使用）</label>
    <div class="chips" id="f-pay">${SHOP.pay.map((p,i)=>`<button type="button" class="chip" data-pay="${p}" aria-pressed="${(pickPay||SHOP.pay[0])===p}">${payName(p)}</button>`).join("")}</div>`:""}
    ${F.member?`<label class="chk" for="f-join"><input type="checkbox" id="f-join" checked> 用這支手機同時加入會員（已是會員會自動辨識）</label>`:""}
    <h2 class="sec">預約內容</h2>
    <div class="card"><ul class="sum">${items.map(i=>`<li><span>${esc(i.name)}</span><span>${money(i.price)}${i.up?" up":""}</span></li>`).join("")}</ul>
      <div class="total"><span>預估金額</span><span>${money(sum)}${up?" 起":""}</span></div></div>
    <p class="err" id="f-err" hidden></p>
    <div class="actions"><button class="btn" type="submit" id="f-submit">確認預約</button><button class="btn ghost" type="button" data-go="menu">修改項目</button></div>
  </form>`;
  const dd=$("#v-book .date[aria-pressed='true']");if(dd)dd.scrollIntoView({block:"nearest",inline:"center"});
}
$("#v-book").addEventListener("click",e=>{
  const t=e.target.closest("button");if(!t)return;
  if(t.dataset.date){pickDate=t.dataset.date;pickTime=null;keepForm(renderBook)}
  else if(t.dataset.time){pickTime=t.dataset.time;keepForm(renderBook)}
  else if(t.dataset.pay){pickPay=t.dataset.pay;document.querySelectorAll("#f-pay .chip").forEach(c=>c.setAttribute("aria-pressed",c===t))}
  else if(t.dataset.newbook!==undefined){lastBooking=null;resetSel();go("menu")}
  else if(t.dataset.lookup!==undefined){const p=lastBooking.phone;lastBooking=null;resetSel();go("mine");$("#q").value=p;doLookup()}

function keepForm(fn){const v={n:$("#f-name")?.value,p:$("#f-phone")?.value,o:$("#f-note")?.value};fn();
  if($("#f-name")){$("#f-name").value=v.n||"";$("#f-phone").value=v.p||"";$("#f-note").value=v.o||""}}
$("#v-book").addEventListener("submit",async e=>{
  e.preventDefault();const err=$("#f-err");
  const name=$("#f-name").value.trim(),phone=$("#f-phone").value.replace(/\D/g,""),note=$("#f-note").value.trim();
  const fail=m=>{err.textContent=m;err.hidden=false};
  if(!pickDate||!pickTime)return fail("請選擇預約日期與時間。");
  if(!name)return fail("請填寫姓名。");
  if(!/^09\d{8}$/.test(phone))return fail("手機號碼請輸入 09 開頭的 10 位數字。");
  if(isPast(pickDate,pickTime)||slotBlocked(pickDate,pickTime)){pickTime=null;keepForm(renderBook);return fail("這個時段剛剛被預約走了，請改選其他時間。")}
  const items=chosenItems(),{sum,up}=totals(items);
  const code=genCode();
  const b={code,name,phone,note,date:pickDate,time:pickTime,items,total:sum,up,pay:F.pay?(SHOP.pay.includes(pickPay)?pickPay:SHOP.pay[0]):null,status:"pending",source:"online",createdAt:new Date().toISOString()};
  const btn=$("#f-submit");btn.disabled=true;btn.textContent="送出中…";
  try{await addBooking(b)}catch(er){console.warn(er);btn.disabled=false;btn.textContent="確認預約";return fail("網路不穩，預約沒有送出，請再按一次。")}
  notify("new",b);
  if(F.member&&$("#f-join")?.checked){try{if(!(await fetchMember(phone)))await joinMember(name,phone,"");setMe(phone)}catch(er){console.warn(er)}}

async function doLookup(){
  const raw=$("#q").value.trim();if(!raw)return;
  const ph=raw.replace(/\D/g,"");let found;
  if(CLOUD){
    if(!/^09\d{8}$/.test(ph)){$("#res").innerHTML=`<p class="empty">請輸入預約時留下的 10 位數手機號碼。</p>`;return}
    $("#res").innerHTML=`<p class="empty">查詢中…</p>`;
    try{const d=await fdb.collection("lookup").doc(await sha(ph)).get(),ids=d.exists?(d.data().ids||[]).slice(-30):[];
      const docs=await Promise.all(ids.map(id=>fdb.collection("bookings").doc(id).get()));
      found=docs.filter(x=>x.exists).map(x=>({id:x.id,...x.data()})).filter(b=>b.phone===ph).sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time))}
    catch(er){console.warn(er);$("#res").innerHTML=`<p class="empty">網路不穩，查詢失敗，請再試一次。</p>`;return}
  }else found=load().filter(b=>(raw.length<=3&&b.code===raw&&isActive(b)&&!isPast(b.date,b.time))||(ph.length>=8&&b.phone===ph)).sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time));
  lastFound=found;const res=$("#res");
  if(!found.length){res.innerHTML=`<p class="empty">找不到符合的預約，請確認號碼或代碼是否正確。</p>`;return}
  res.innerHTML=found.map(b=>{const past=isPast(b.date,b.time);
    const st=b.status==="cancelled"?`<span class="status off">已取消</span>`:past?`<span class="status off">已過期</span>`:b.status==="confirmed"?`<span class="status on">店家已確認</span>`:`<span class="status past">待店家確認</span>`;
    return `<div class="card"><div class="row"><span class="name">${fmtDate(b.date)} ${b.time}</span>${st}</div>
    <p class="meta">代碼 ${b.code}・${esc(b.name)}</p>
    <p class="meta">${b.items.map(i=>esc(i.name)).join("、")}</p>
    <p class="meta">預估 ${money(b.total)}${b.up?" 起":""}${F.pay&&b.pay?`・${payName(b.pay)}`:""}${b.note?`・備註：${esc(b.note)}`:""}</p>
    ${isActive(b)&&!past?(pendingCancel===b.code
      ?`<div class="confirm">確定要取消這筆預約嗎？取消後時段會釋出給其他客人。<div class="actions"><button class="btn danger" data-cancel-yes="${b.code}" data-d="${b.date}" data-t="${b.time}">確定取消</button><button class="btn ghost" data-cancel-no>保留預約</button></div></div>`
      :`<div class="actions"><button class="btn ghost" data-cancel="${b.code}">取消預約</button></div>`):""}
    </div>`}).join("");
}
$("#v-mine").addEventListener("submit",e=>{e.preventDefault();pendingCancel=null;doLookup()});
$("#v-mine").addEventListener("click",e=>{const t=e.target.closest("button");if(!t)return;
  if(t.dataset.cancel){pendingCancel=t.dataset.cancel;doLookup()}
  else if(t.dataset.cancelNo!==undefined){pendingCancel=null;doLookup()}
  else if(t.dataset.cancelYes){const b=lastFound.find(x=>x.code===t.dataset.cancelYes&&x.date===t.dataset.d&&x.time===t.dataset.t&&isActive(x));
    t.disabled=true;(b?changeStatus(b,"cancelled").then(()=>notify("cancel",b)):Promise.resolve()).catch(er=>console.warn(er)).finally(()=>{pendingCancel=null;doLookup()})}
});

/* 計算一筆異動後的餘額和贈品；不夠扣就回傳錯誤 */
function applyOp(w,op){const bal=(w.balance||0)+(op.amount||0);
  if(bal<0)return {err:`餘額不足，目前只有 ${money(w.balance||0)}。`};
  const g=JSON.parse(JSON.stringify(w.gifts||{}));
  for(const x of op.gifts||[]){const c=g[x.name]||{n:0,kind:x.kind||"service"};
    if(c.n+x.n<0)return {err:`「${x.name}」只剩 ${c.n} ${unit(c.kind)}，不夠扣。`};
    c.n+=x.n;if(c.n===0)delete g[x.name];else g[x.name]=c}
  return {balance:bal,gifts:g}}

async function walletDo(tk,op){const t=new Date().toISOString(),by=await opName();
  const mk=w=>{const r=applyOp(w,op);if(r.err)throw userErr(r.err);
    const log={t,type:op.type,amount:op.amount||0,gifts:(op.gifts||[]).map(g=>({name:g.name,n:g.n})),balance:r.balance,note:op.note||"",by};
    if(op.paid!=null){log.paid=op.paid;log.pay=op.pay||""}
    return {upd:{...(op.patch||{}),balance:r.balance,gifts:r.gifts,updatedAt:t},log}};
  if(!CLOUD){const all=loadW(),w=all[tk];if(!w)throw userErr("找不到這張會員卡。");const {upd,log}=mk(w);Object.assign(w,upd);(w.logs=w.logs||[]).unshift(log);saveW(all);const {logs,...r}=w;return {tk,...r}}
  const ref=fdb.collection("wallets").doc(tk);
  return fdb.runTransaction(async tx=>{const s=await tx.get(ref);if(!s.exists)throw userErr("找不到這張會員卡。");const {upd,log}=mk(s.data());
    tx.update(ref,upd);tx.set(ref.collection("logs").doc(),log);return {tk,...s.data(),...upd}})}

const WT={open:"開卡",topup:"儲值",spend:"扣款",redeem:"使用贈品",adjust:"調整",edit:"修改資料"};
function giftsHTML(w){const g=Object.entries(w.gifts||{});return g.length?`<p class="meta" style="margin:8px 0 0">贈品</p><div class="gl">${g.map(([n,x])=>`<span>${esc(n)}　剩 ${x.n} ${unit(x.kind)}</span>`).join("")}</div>`:""}
function logsHTML(l,staff){if(!l)return `<p class="sec-note">讀取中…</p>`;if(!l.length)return `<p class="sec-note">還沒有紀錄。</p>`;
  return `<div class="card"><ul class="log">${l.map(x=>{const gs=(x.gifts||[]).map(g=>`${esc(g.name)} ${g.n>0?"＋":"−"}${Math.abs(g.n)}`).join("、");
    const sub=[x.note?esc(x.note):"",x.pay?payName(x.pay):"",staff&&x.by?"經手 "+esc(x.by):""].filter(Boolean).join("・");
    return `<li><span><b>${WT[x.type]||esc(x.type)}</b>　${fmtDT(x.t)}${sub?`<small>${sub}</small>`:""}</span>
    <span class="r">${x.amount?`<span class="${x.amount>0?"plus":"minus"}">${x.amount>0?"+":"−"}${money(Math.abs(x.amount))}</span>`:""}${gs?`<small>${gs}</small>`:""}${x.amount||x.type==="topup"?`<small>餘額 ${money(x.balance)}</small>`:""}</span></li>`}).join("")}</ul></div>`}
const itemsList=()=>`<datalist id="w-items">${allItems().map(i=>`<option value="${esc(i.name)}">`).join("")}</datalist>`;

let myCard=null;try{myCard=localStorage.getItem(CARDKEY)}catch(e){}
let cardW=null,cardLogs=null,cardErr="";
function setCard(tk){myCard=tk;cardW=cardLogs=null;cardErr="";try{tk?localStorage.setItem(CARDKEY,tk):localStorage.removeItem(CARDKEY)}catch(e){}}
async function loadCard(){if(!myCard)return;cardErr="";
  try{cardW=await getWallet(myCard);if(!cardW)cardErr="找不到這張會員卡，請到店裡請店家重新給你綁定 QR code。";else cardLogs=await getLogs(myCard)}
  catch(e){console.warn(e);cardErr="網路不穩，請稍後再試。"}
  if(view==="card")renderCard()}
function plansNote(){const ps=(SHOP.plans||[]).filter(p=>p.on);return ps.length?`<h2 class="sec">儲值方案</h2><div class="list">${ps.map(p=>`<div class="card"><span class="name" style="font-size:16px">${esc(planName(p))}</span></div>`).join("")}</div><p class="fine">到店結帳時告訴店家要儲值即可。</p>`:""}
function renderCard(){const el=$("#v-card");
  if(!myCard){el.innerHTML=`<h2 class="sec">儲值會員卡</h2><p class="sec-note">這支手機還沒有綁定會員卡。</p><div class="card"><p style="margin:0">到店儲值或結帳時，請店家出示「綁定 QR code」，用手機相機掃描，會員卡就會存到這支手機。之後打開這個網站的「會員卡」，就看得到條碼、餘額、贈品和所有紀錄。</p></div>${plansNote()}`;return}
  if(!cardW){el.innerHTML=`<h2 class="sec">我的會員卡</h2>${cardErr?`<p class="err">${cardErr}</p><div class="actions"><button class="btn ghost" data-cardre>重新整理</button><button class="btn ghost" data-cardrm>移除這張卡</button></div>`:`<p class="sec-note">讀取中…</p>`}`;return}
  const w=cardW;
  el.innerHTML=`<h2 class="sec">我的會員卡</h2>
  <div class="mcard"><span class="name">伶髮藝 儲值會員卡</span><p class="meta" style="margin:2px 0 0">${esc(w.name)}</p>
    <div class="qrbox"><img data-qr="${esc(cardURL(myCard))}" alt="會員條碼"></div><p class="meta" style="text-align:center;margin:0">結帳時出示給店家掃描</p>

  ${plansNote()}
  <div class="actions"><button class="btn ghost" data-cardrm>這不是我的卡，移除</button></div>`;

let cardRm=false;

  if(t.dataset.cardrm!==undefined){if(!cardRm){cardRm=true;t.textContent="再按一次確認移除（之後要請店家重新綁定）";return}cardRm=false;setCard(null);go("menu")}});
function checkHash(){const tk=parseTk(location.hash);if(!tk)return false;setCard(tk);try{history.replaceState(null,"",location.pathname+location.search)}catch(e){}go("card");return true}

/* --- 店家：儲值會員 --- */
let wList=null,wSel=null,wLogs=null,wPanel=null,wMsg="",wErr="",wBusy=false,wQ="",wPlan=null,wUse=null;
function wReset(){wMsg=wErr="";wUse=null}
async function openWallet(tk,panel){wReset();wBusy=true;renderAdmin();
  try{const w=await getWallet(tk);if(!w){wErr="找不到這張會員卡。";wSel=null}else{wSel=w;wPanel=panel||null;wLogs=null;getLogs(tk).then(l=>{if(wSel&&wSel.tk===tk){wLogs=l;reW()}}).catch(e=>{console.warn(e);wLogs=[]})}}
  catch(e){console.warn(e);wErr="網路不穩，請再試一次。"}
  wBusy=false;reW()}
function reW(){if(view==="admin"&&adminTab==="wallet"){const y=window.scrollY;renderAdmin();window.scrollTo(0,y)}}
async function wRun(op,ok){if(wBusy)return;wReset();wBusy=true;reW();
  try{wSel=await walletDo(wSel.tk,op);wMsg=ok;wPanel=null;wPlan=null;wLogs=await getLogs(wSel.tk).catch(()=>wLogs)}catch(er){console.warn(er);wErr=errMsg(er)}
  wBusy=false;wList=null;reW()}

  if(!wSel){if(wList===null){wList=false;findWallets(wQ||null).then(l=>{wList=l;reW()}).catch(e=>{console.warn(e);wList=[];wErr="會員資料讀取失敗，請確認安全規則已更新。";reW()})}

    ${!wList?`<p class="sec-note">讀取中…</p>`:wList.length?`<div class="list">${wList.map(w=>`<button class="card wrow" data-wopen="${w.tk}"><span><b>${esc(w.name)}</b>　<span class="meta">${fmtPhone(w.phone)}</span>${Object.keys(w.gifts||{}).length?`<small class="meta" style="display:block">${Object.entries(w.gifts).map(([n,x])=>`${esc(n)} ${x.n}`).join("、")}</small>`:""}</span><span class="price">${money(w.balance||0)}</span></button>`).join("")}</div>`

    ${cus?`<div style="display:flex;gap:8px"><div style="flex:1"><label class="f" for="wt-pay">收款金額</label><input class="t" id="wt-pay" type="number" inputmode="numeric" min="1"></div><div style="flex:1"><label class="f" for="wt-bonus">加贈金額</label><input class="t" id="wt-bonus" type="number" inputmode="numeric" min="0" value="0"></div></div>`:""}

    ${p?`<p class="notice">收 ${money(p.pay)}，入帳 ${money(p.pay+p.bonus)}${p.gifts.length?`<br>另外贈送：${p.gifts.map(g=>`${esc(g.name)} ×${g.n}`).join("、")}`:""}<br>儲值後餘額 ${money((w.balance||0)+p.pay+p.bonus)}</p>`:""}
    ${msgs}<div class="actions"><button class="btn" type="submit" ${wBusy?"disabled":""}>確認儲值</button></div>`:`<p class="sec-note" style="margin-top:10px">${plans.length?"":"還沒有啟用的儲值方案，可以到「店家設定」新增，或用自訂金額。"}</p>`}</form>`}
  else if(wPanel==="spend")panel=`<form id="w-spend" class="card" novalidate><p class="meta" style="margin:0">目前餘額 ${money(w.balance||0)}</p>

    ${msgs}<div class="actions"><button class="btn" type="submit" ${wBusy?"disabled":""}>確認扣款</button></div></form>`;
  else if(wPanel==="redeem")panel=`<div class="card">${gifts.length?gifts.map(([n,x])=>`<div class="row" style="align-items:center;margin-top:6px"><span>${esc(n)}<small class="meta">　剩 ${x.n} ${unit(x.kind)}</small></span><button class="chip" data-wuse="${esc(n)}">使用 1 ${unit(x.kind)}</button></div>`).join(""):`<p class="sec-note" style="margin:0">這位客人目前沒有贈品。</p>`}

  else if(wPanel==="adjust")panel=`<form id="w-adj" class="card" novalidate><p class="sec-note" style="margin:0">輸入錯誤或特殊情況時使用，會留下紀錄。要減少請輸入負數，例如 -500。</p>
    <label class="f" for="wa-amt">餘額增減</label><input class="t" id="wa-amt" type="number" inputmode="numeric" placeholder="0">
    <label class="f" for="wa-gift">贈品增減（選填）</label><div class="grow"><input class="t" id="wa-gift" list="w-gifts" placeholder="贈品名稱" style="flex:1;min-width:0"><select class="t" id="wa-kind" style="width:84px"><option value="service">服務</option><option value="product">產品</option></select><input class="t" id="wa-n" type="number" inputmode="numeric" placeholder="0" style="width:64px"></div>
    <datalist id="w-gifts">${gifts.map(([n])=>`<option value="${esc(n)}">`).join("")}${allItems().map(i=>`<option value="${esc(i.name)}">`).join("")}</datalist>
    <label class="f" for="wa-note">原因（必填）</label><input class="t" id="wa-note" placeholder="例：儲值金額輸入錯誤">
    ${msgs}<div class="actions"><button class="btn" type="submit" ${wBusy?"disabled":""}>確認調整</button></div></form>`;
  else if(wPanel==="bind")panel=`<div class="card" style="text-align:center"><p style="margin:0">請客人用<b>手機相機</b>掃描，會員卡就會存到他的手機。</p>
    <div class="qrbox"><img data-qr="${esc(cardURL(w.tk))}" alt="綁定 QR code"></div><p class="fine">客人換手機或刪掉了，再掃一次就好。這個 QR code 等同會員卡，請只給本人掃。</p>${msgs}</div>`;
  else if(wPanel==="edit")panel=`<form id="w-edit" class="card" novalidate>
    <label class="f" for="we-name">客人姓名</label><input class="t" id="we-name" value="${esc(w.name)}">
    <label class="f" for="we-phone">手機號碼</label><input class="t" id="we-phone" type="tel" inputmode="numeric" value="${esc(w.phone)}">
    ${msgs}<div class="actions"><button class="btn" type="submit" ${wBusy?"disabled":""}>儲存</button></div></form>`;
  return top+`<div class="mcard" style="margin-top:14px"><div class="row"><span class="name">${esc(w.name)}</span><span class="meta" style="margin:0">${fmtPhone(w.phone)}</span></div>
    <p class="meta" style="margin:10px 0 0">儲值餘額</p><div class="bal">${money(w.balance||0)}</div>${giftsHTML(w)}</div>
  <div class="chips">${P.map(([k,n])=>`<button class="chip" data-wpanel="${k}" aria-pressed="${wPanel===k}">${n}</button>`).join("")}</div>

  return `<h2 class="sec">儲值方案</h2><p class="sec-note">在「儲值會員」幫客人儲值時直接選。修改只影響之後的儲值，已經入帳的不會變。停用的方案客人和店家都看不到。</p>
  <div class="list">${ps.map((p,i)=>`<div class="card ${p.on?"":"dim"}" data-pi="${i}">
    <div class="row" style="align-items:center"><span class="name" style="font-size:15px">${esc(planName(p))}</span><button class="chip" data-pon="${i}" aria-pressed="${p.on}">${p.on?"使用中":"已停用"}</button></div>
    <div style="display:flex;gap:8px"><div style="flex:1"><label class="f">收款金額</label><input class="t" type="number" inputmode="numeric" min="1" data-pf="pay" value="${p.pay}"></div><div style="flex:1"><label class="f">加贈金額</label><input class="t" type="number" inputmode="numeric" min="0" data-pf="bonus" value="${p.bonus}"></div></div>
    <label class="f">贈送服務或產品</label>
    ${p.gifts.map((g,j)=>`<div class="grow"><input class="t" data-gf="name" data-gj="${j}" value="${esc(g.name)}" list="w-items" placeholder="名稱" style="flex:1;min-width:0"><select class="t" data-gf="kind" data-gj="${j}" style="width:84px"><option value="service" ${g.kind!=="product"?"selected":""}>服務</option><option value="product" ${g.kind==="product"?"selected":""}>產品</option></select><input class="t" type="number" inputmode="numeric" min="1" data-gf="n" data-gj="${j}" value="${g.n}" style="width:64px"><button class="chip" data-gdel="${i}:${j}" aria-label="移除這個贈品">✕</button></div>`).join("")||`<p class="sec-note" style="margin:0">沒有贈品。</p>`}
    <div class="actions"><button class="chip" data-gadd="${i}">＋ 贈品</button><button class="chip" data-pdel="${i}">刪除方案</button></div></div>`).join("")}</div>
  <div class="actions"><button class="btn ghost" data-padd>＋ 新增方案</button></div>${itemsList()}`}
const int=(v,min,max)=>{const n=Math.round(Number(v));return Number.isFinite(n)?Math.max(min,Math.min(max,n)):min};
$("#v-admin").addEventListener("change",e=>{const c=e.target.closest("[data-pi]");if(!c||!(e.target.dataset.pf||e.target.dataset.gf))return;
  const p=SHOP.plans[+c.dataset.pi];
  if(e.target.dataset.pf)p[e.target.dataset.pf]=int(e.target.value,e.target.dataset.pf==="pay"?1:0,1e6);
  else{const g=p.gifts[+e.target.dataset.gj],f=e.target.dataset.gf;g[f]=f==="n"?int(e.target.value,1,99):f==="name"?e.target.value.trim().slice(0,30):e.target.value}
  saveSettings();reAdmin()});
const reAdmin=()=>{const y=window.scrollY;renderAdmin();window.scrollTo(0,y)};
$("#v-admin").addEventListener("click",e=>{const t=e.target.closest("button");if(!t)return;const d=t.dataset;
  if(d.padd!==undefined){SHOP.plans.push({id:"p"+Date.now().toString(36),pay:3000,bonus:0,gifts:[],on:true});saveSettings();reAdmin()}
  else if(d.pon){const p=SHOP.plans[+d.pon];p.on=!p.on;saveSettings();reAdmin()}
  else if(d.pdel){if(t.dataset.sure){SHOP.plans.splice(+d.pdel,1);saveSettings();reAdmin()}else{t.dataset.sure="1";t.textContent="再按一次確認刪除"}}
  else if(d.gadd){SHOP.plans[+d.gadd].gifts.push({name:"",kind:"service",n:1});saveSettings();reAdmin()}
  else if(d.gdel){const [i,j]=d.gdel.split(":").map(Number);SHOP.plans[i].gifts.splice(j,1);saveSettings();reAdmin()}
  else if(d.wscan!==undefined)openScan();
  else if(d.wnew!==undefined){wSel=null;wPanel="new";wReset();reW()}
  else if(d.wclose!==undefined){wSel=null;wPanel=null;wList=null;wReset();reW()}
  else if(d.wopen)openWallet(d.wopen);
  else if(d.wpanel){wPanel=wPanel===d.wpanel?null:d.wpanel;wPlan=null;wReset();reW()}
  else if(d.wplan){wPlan=d.wplan;wErr="";reW()}
  else if(d.wuse){wUse=d.wuse;wErr=wMsg="";reW()}
  else if(d.wuseNo!==undefined){wUse=null;reW()}
  else if(d.wuseYes!==undefined){const n=wUse,k=(wSel.gifts[n]||{}).kind;wRun({type:"redeem",gifts:[{name:n,kind:k,n:-1}],note:""},`已使用「${esc(n)}」1 ${unit(k)}。`)}});
$("#v-admin").addEventListener("submit",async e=>{const id=e.target.id;if(!id.startsWith("w-"))return;e.preventDefault();
  const fail=m=>{wErr=m;wMsg="";const keep=[...e.target.querySelectorAll("input,select")].map(i=>[i.id,i.value]);reW();keep.forEach(([k,v])=>{const i=k&&document.getElementById(k);if(i)i.value=v})};
  if(id==="w-q"){wQ=$("#wq").value.replace(/\D/g,"");wSel=null;wPanel=null;wList=null;wReset();reW();return}
  if(id==="w-new"){const name=$("#wn-name").value.trim().slice(0,20),phone=$("#wn-phone").value.replace(/\D/g,"");
    if(!name)return fail("請填寫客人姓名。");if(!/^09\d{8}$/.test(phone))return fail("手機號碼請輸入 09 開頭的 10 位數字。");
    wBusy=true;reW();try{const w=await createWallet(name,phone);wBusy=false;await openWallet(w.tk,"bind");wMsg=`已建立 ${esc(name)} 的會員卡。請客人掃描上面的 QR code 存到手機，再按「儲值」。`;reW()}
    catch(er){console.warn(er);wBusy=false;fail(errMsg(er))}return}
  if(id==="w-top"){const p=(SHOP.plans||[]).find(x=>x.id===wPlan),pay=$("#wt-pay-m").value,note=$("#wt-note").value.trim().slice(0,60);
    let paid,bonus,gifts=[],label;
    if(p){paid=p.pay;bonus=p.bonus;gifts=p.gifts.filter(g=>g.name).map(g=>({name:g.name,kind:g.kind,n:g.n}));label=planName(p)}
    else{paid=Math.round(Number($("#wt-pay").value));bonus=Math.round(Number($("#wt-bonus").value)||0);
      if(!(paid>0&&paid<=1e6))return fail("請輸入收款金額。");if(!(bonus>=0&&bonus<=1e6))return fail("加贈金額不正確。");label=`自訂：收 ${money(paid)}${bonus?` 送 ${money(bonus)}`:""}`}
    return wRun({type:"topup",amount:paid+bonus,gifts,paid,pay,note:label+(note?`（${note}）`:"")},`儲值完成，入帳 ${money(paid+bonus)}${gifts.length?"，贈品已加入":""}。`)}
  if(id==="w-spend"){const amt=Math.round(Number($("#ws-amt").value)),item=$("#ws-item").value.trim().slice(0,60);
    if(!(amt>0))return fail("請輸入扣款金額。");if(!item)return fail("請填寫消費項目。");if(amt>(wSel.balance||0))return fail(`餘額不足，目前只有 ${money(wSel.balance||0)}。`);
    return wRun({type:"spend",amount:-amt,note:item},`已扣款 ${money(amt)}。`)}
  if(id==="w-adj"){const amt=Math.round(Number($("#wa-amt").value)||0),gn=$("#wa-gift").value.trim().slice(0,30),n=Math.round(Number($("#wa-n").value)||0),note=$("#wa-note").value.trim().slice(0,60);
    if(!amt&&!(gn&&n))return fail("請輸入要調整的金額，或贈品名稱和數量。");if(gn&&!n)return fail("請輸入贈品要增減的數量。");if(!note)return fail("請填寫調整原因。");
    const kind=(wSel.gifts[gn]||{}).kind||$("#wa-kind").value;
    return wRun({type:"adjust",amount:amt,gifts:gn&&n?[{name:gn,kind,n}]:[],note:"原因："+note},"調整完成。")}
  if(id==="w-edit"){const name=$("#we-name").value.trim().slice(0,20),phone=$("#we-phone").value.replace(/\D/g,"");
    if(!name)return fail("請填寫客人姓名。");if(!/^09\d{8}$/.test(phone))return fail("手機號碼請輸入 09 開頭的 10 位數字。");
    const ch=[name!==wSel.name?`姓名 ${wSel.name} → ${name}`:"",phone!==wSel.phone?`手機 ${wSel.phone} → ${phone}`:""].filter(Boolean);
    if(!ch.length){wPanel=null;return reW()}
    if(phone!==wSel.phone){try{if((await findWallets(phone)).length)return fail("這支手機號碼已經是另一位會員了。")}catch(er){return fail(errMsg(er))}}
    return wRun({type:"edit",patch:{name,phone},note:ch.join("、")},"資料已更新。")}
});

/* 相機掃描會員條碼：支援的瀏覽器用內建 BarcodeDetector，其他（例如 iPhone）載入 jsQR */
let scanning=null;
async function openScan(){if(scanning)return;
  const ov=document.createElement("div");ov.id="scan";ov.innerHTML=`<div class="scan-in"><video playsinline muted></video><p>把客人的會員條碼對準框框</p><button class="btn ghost" type="button">取消</button></div>`;document.body.appendChild(ov);
  let stream=null,stop=false;const close=()=>{stop=true;scanning=null;if(stream)stream.getTracks().forEach(t=>t.stop());ov.remove()};scanning=close;
  ov.querySelector("button").onclick=close;
  const fail=m=>{close();wErr=m;wMsg="";reW()};
  try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:"environment"},audio:false})}catch(e){return fail("無法開啟相機，請允許這個網站使用相機，或改用手機號碼查詢。")}
  if(stop){stream.getTracks().forEach(t=>t.stop());return}
  const v=ov.querySelector("video");v.srcObject=stream;try{await v.play()}catch(e){}
  let det=null,jsqr=null;
  if("BarcodeDetector" in window){try{det=new BarcodeDetector({formats:["qr_code"]})}catch(e){}}
  if(!det){try{jsqr=await lib(JSQR_LIB,"jsQR")}catch(e){return fail("掃描元件載入失敗，請檢查網路，或改用手機號碼查詢。")}}
  const cv=document.createElement("canvas"),g=cv.getContext("2d",{willReadFrequently:true});
  const tick=async()=>{if(stop)return;let txt=null;
    try{if(v.readyState>=2){if(det){const r=await det.detect(v);txt=r[0]&&r[0].rawValue}
      else{const k=Math.min(1,640/Math.max(v.videoWidth,v.videoHeight));cv.width=v.videoWidth*k;cv.height=v.videoHeight*k;g.drawImage(v,0,0,cv.width,cv.height);const r=jsqr(g.getImageData(0,0,cv.width,cv.height).data,cv.width,cv.height,{inversionAttempts:"dontInvert"});txt=r&&r.data}}}catch(e){}
    if(stop)return;
    if(txt){const tk=parseTk(txt);if(tk){close();openWallet(tk);return}ov.querySelector("p").textContent="這不是伶髮藝的會員條碼，請再試一次"}
    setTimeout(tick,200)};
  tick()}

/* ===== 分頁與底部列 ===== */
function go(v){view=v;
  document.querySelectorAll("nav.tabs button").forEach(b=>b.setAttribute("aria-selected",b.dataset.view===v));
  for(const k of ["menu","book","mine","member","card","admin"])$("#v-"+k).hidden=k!==v;
  if(v==="book")renderBook();
  if(v==="admin")renderAdmin();
  if(v==="member"){renderMember();if(CLOUD&&mePhone&&!getMember(mePhone))fetchMember(mePhone).then(()=>renderMember()).catch(er=>console.warn(er))}
  if(v==="mine"&&!$("#q"))renderMine();
  if(v==="card"){renderCard();if(myCard)loadCard()}
  updateBar();window.scrollTo(0,0);
}
document.querySelector("nav.tabs").addEventListener("click",e=>{const b=e.target.closest("button");if(b)go(b.dataset.view)});
document.addEventListener("click",e=>{const g=e.target.closest("[data-go]");if(g)go(g.dataset.go)});
function updateBar(){
  const items=chosenItems(),{sum,up}=totals(items);
  $("#bar").hidden=view!=="menu";
  $("#bar-count").textContent=items.length?`已選 ${items.length} 項・預估金額`:"尚未選擇項目";
  $("#bar-total").textContent=money(sum)+(up?" 起":"");
  $("#bar-next").disabled=!items.length;
}
$("#bar-next").addEventListener("click",()=>{lastBooking=null;go("book")});
